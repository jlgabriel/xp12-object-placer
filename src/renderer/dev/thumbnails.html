<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XP Object Placer — thumbnail harness</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 16px;
        background: #11151a;
        color: #dfe6ee;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      #summary { color: #8d9aa8; margin-bottom: 16px; }
      #grid { display: flex; flex-wrap: wrap; gap: 14px; }
      figure { margin: 0; width: 168px; }
      canvas.shot {
        width: 168px;
        height: 168px;
        border-radius: 6px;
        border: 1px solid #263039;
        /* Chequerboard, so a transparent background is visible as transparent rather than as
           whatever the page happens to be painted. */
        background-image:
          linear-gradient(45deg, #1b222a 25%, transparent 25%, transparent 75%, #1b222a 75%),
          linear-gradient(45deg, #1b222a 25%, transparent 25%, transparent 75%, #1b222a 75%);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
      }
      figcaption { margin-top: 5px; font-family: ui-monospace, monospace; font-size: 11px; }
      .meta { color: #8d9aa8; }
      .fail { color: #e0776b; }
      #error { color: #e0776b; white-space: pre-wrap; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Thumbnail harness</h1>
    <div id="summary">loading…</div>
    <div id="error"></div>
    <div id="grid"></div>
    <script type="module" src="./thumbnails.ts"></script>
  </body>
</html>
