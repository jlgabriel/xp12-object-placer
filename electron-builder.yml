# Packaging for XP Object Placer.
#
# Unsigned, deliberately: a Windows certificate costs money every year and an Apple one costs money
# and a Mac, and neither is worth it before anybody has asked for this. The README carries the
# SmartScreen and Gatekeeper steps instead. Installers land in dist/, which is gitignored.
#
# There are no bundled assets and there never will be — everything this app draws or writes comes
# from the user's own X-Plane installation (D7). `files` therefore only needs the build output.
appId: com.jlgabriel.xpobjectplacer
productName: XP Object Placer
copyright: © 2026 Juan Luis Gabriel — GPL-3.0-or-later

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.map"

asar: true
# No native modules, so nothing has to be rebuilt against Electron's ABI.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

portable:
  artifactName: ${name}-${version}-portable.${ext}

# macOS builds have to be produced on a Mac; a .dmg cannot be made from Windows. Both architectures,
# so Apple silicon and Intel are covered.
#
# ⚠️ `identity: "-"` is not cosmetic, and leaving it out is what broke v1.0.0 on Apple silicon.
# electron-builder's own documentation is explicit: with no identity set it searches the keychain,
# and "if none is found, signing is skipped for all architectures — there is no automatic ad-hoc
# fallback". The CI runner has no certificate, so the bundle shipped unsigned — while the
# Electron.framework inside it stayed signed by somebody else. A bundle whose seal does not verify
# is not "an unidentified developer" to macOS, it is **damaged**, and that dialog offers exactly one
# button: Move to Trash. There is no right-click-Open past it and redownloading cannot help, which
# is what the first Mac user to try it reported, twice.
#
# Ad-hoc signing does not make us trusted — the app is still unnotarized and still needs the user to
# allow it once — but it makes the app *coherent*, which is the difference between a door with a
# lock and a door that is nailed shut.
#
# hardenedRuntime must go off with it: hardened runtime enforces library validation, which rejects a
# pre-signed framework carrying a different Team ID. It buys nothing without notarization anyway.
mac:
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.utilities

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${name}-${version}.${ext}
